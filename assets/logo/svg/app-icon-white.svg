<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
    <defs>
        
        <linearGradient id="app_bg" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="100%" stop-color="#F8FAFC"/>
        </linearGradient>
        
        
        <linearGradient id="app_flow" x1="8%" y1="65%" x2="92%" y2="65%">
            <stop offset="0%" stop-color="#00B594" />
            <stop offset="28%" stop-color="#00B6EB" />
            <stop offset="64%" stop-color="#0072F5" />
            <stop offset="100%" stop-color="#0047BA" />
        </linearGradient>
        
        <filter id="icon_shadow" x="-10%" y="-10%" width="120%" height="125%">
            <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.25"/>
        </filter>
    </defs>
    <!-- Background with Squircle rounded corners for App Icon -->
    <rect width="1024" height="1024" rx="228" ry="228" fill="url(#app_bg)"/>
    <rect width="1024" height="1024" rx="228" ry="228" fill="none" stroke="#E2E8F0" stroke-width="12"/>
    
    <g transform="translate(134, 292) scale(2.2)" >
        
        <!-- Slender Organic Arched Bridge with 3 Distinct Nodes -->
        <path d="
            M 50 100
            C 80 104, 112 80, 146 44
            C 158 24, 172 14, 186 14
            C 202 14, 216 24, 226 44
            C 234 64, 252 94, 286 104
            A 42 42 0 1 1 248 132
            C 234 116, 206 88, 168 88
            C 130 88, 102 116, 88 132
            A 44 44 0 1 1 50 100 Z
        " fill="url(#app_flow)" />
        
    </g>
</svg>